<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  
  <!-- Terminal window -->
  <rect x="12" y="16" width="96" height="72" rx="8" fill="#0a0a1a" stroke="#333" stroke-width="1"/>
  
  <!-- Terminal title bar -->
  <rect x="12" y="16" width="96" height="16" rx="8" fill="#1a1a2e"/>
  <rect x="12" y="24" width="96" height="8" fill="#1a1a2e"/>
  
  <!-- Terminal dots -->
  <circle cx="22" cy="24" r="3" fill="#e94560"/>
  <circle cx="32" cy="24" r="3" fill="#f39c12"/>
  <circle cx="42" cy="24" r="3" fill="#2ecc71"/>
  
  <!-- M letter (terminal style) -->
  <text x="24" y="52" font-family="monospace" font-size="18" font-weight="bold" fill="#e94560">M</text>
  <text x="38" y="52" font-family="monospace" font-size="18" font-weight="bold" fill="#533483">i</text>
  <text x="46" y="52" font-family="monospace" font-size="18" font-weight="bold" fill="#e94560">M</text>
  <text x="60" y="52" font-family="monospace" font-size="18" font-weight="bold" fill="#533483">o</text>
  
  <!-- Cursor blink -->
  <rect x="72" y="38" width="8" height="18" fill="#e94560" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- AI brain icon -->
  <circle cx="60" cy="80" r="12" fill="none" stroke="url(#glow)" stroke-width="2"/>
  <path d="M54 80 Q57 74 60 80 Q63 74 66 80" fill="none" stroke="url(#glow)" stroke-width="1.5"/>
  <path d="M56 84 Q59 78 62 84" fill="none" stroke="url(#glow)" stroke-width="1"/>
  
  <!-- Connection lines -->
  <line x1="48" y1="72" x2="54" y2="76" stroke="#533483" stroke-width="1" opacity="0.6"/>
  <line x1="72" y1="72" x2="66" y2="76" stroke="#533483" stroke-width="1" opacity="0.6"/>
  
  <!-- Version badge -->
  <rect x="80" y="88" width="28" height="12" rx="6" fill="url(#accent)"/>
  <text x="94" y="97" font-family="monospace" font-size="8" fill="white" text-anchor="middle">v1.0</text>
</svg>
