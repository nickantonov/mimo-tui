<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  
  <!-- Terminal dots -->
  <circle cx="6" cy="6" r="1.5" fill="#e94560"/>
  <circle cx="11" cy="6" r="1.5" fill="#f39c12"/>
  <circle cx="16" cy="6" r="1.5" fill="#2ecc71"/>
  
  <!-- M -->
  <text x="4" y="16" font-family="monospace" font-size="10" font-weight="bold" fill="#e94560">M</text>
  
  <!-- Cursor -->
  <rect x="14" y="10" width="4" height="10" fill="#e94560" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- AI dot -->
  <circle cx="24" cy="24" r="4" fill="none" stroke="#533483" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="1.5" fill="#e94560"/>
</svg>
